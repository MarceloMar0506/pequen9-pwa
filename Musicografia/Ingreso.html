  <script>


  $(document).ready(function() {
   
  // DeterminaMotor();
   //$.getScript("../../F1/General" + langB + ".js");
    KEY ="UsuarioActual";
    get().then(function (value) {

  
    if (value != null){$('.board').text(value); }
      UsuarioActual = value;
      var repl = '<span class="seleccClass">' + value + '</span>';	
      $(".board").html($(".board").html().replace(value, repl)); 
      
      var miVar2 = setTimeout(function(){ 
  

      //console.log($('.board').text());
      if ($('.board').text() == " ")
      {
        DeterminaMotor(Gres.Ingreso0);       
      }  
      else if ($('.board').text() != "")
      {
        DeterminaMotor($('.board').text() + " " + Gres.Ingreso1);      
      } 
     
		},10);

  
    });



    $("#virtual-keyboard a").on('mouseup', function(e) {
        e.preventDefault();

      if ($(this).attr('data') == "INGRESAR")
      {
        Navega();
        return;
      } 
      else if ($('.board').text() ==  UsuarioActual && pvez == true)
       {
         pvez = false;
         $('.board').text("");
         $('.board').css('background-color','white');
         return;
       }
        
       else if ($(this).attr('data') == 'RETROCESO') {
              board_text = $('.board').text();
              board_text = board_text.substring(0, board_text.length-1);
              $('.board').text(board_text);
            }
        else {      
         
          if ($('.board').text() == " ") {$('.board').text("")}                     
              $('.board').text($('.board').text() + $(this).attr('data'));              
          }
      });
  });

 

  $(document).keyup(function(e) {
    
    
    if (e.keyCode == 27)
    {
      Regresar();
    }

    if (e.keyCode == 13)
      {
        if (primerEnter == true) {
          primerEnter =false;         
          return}
        else {
           Navega();
         }
      } 
  //Ayuda
  if (e.keyCode == 112) {
   // $.getScript("../../F1/Generales.js", function(){
      movil = 0;
      TecladoQ();    
      Ayuda();
    //});
  }

  //retroceso
  if (e.keyCode == 8)
    {
          board_text = $('.board').text();
          Lee(Gres.borro  + board_text.substring(board_text.length-1, board_text.length));
          board_text = board_text.substring(0, board_text.length-1);
          if (board_text == ""){board_text = " "}
          $('.board').text(board_text);  
    }

    var ev = $('.board');

    if (ev.is(':visible') == false ) {return}      
 
      pulsada = e.key;
      //console.log(pulsada + "  " + isLetter(pulsada));
      //si no es una letra retorna
      if (isLetter(pulsada) == false){return}

      if (e.keyCode !=32)
       {
      pulsada = e.key.toUpperCase()
       }

      if (pulsada == "INGRESAR")
      {
        Navega();
       
      }
      else if (pulsada == "BACKSPACE")
      {
          board_text = $('.board').text();
          Lee(Gres.borro + board_text.substring(board_text.length-1, board_text.length));
          board_text = board_text.substring(0, board_text.length-1);
          $('.board').text(board_text);  
      } 
      else if (pulsada == "F7")
      {
        return;
      }
      else if (pulsada.includes("ARROW") )
      {
        Lee($('.board').text());
      }
      else 
      {
       if (e.keyCode !=32)
       {
        Lee(pulsada.toLowerCase());
       }
       if (e.keyCode ==32)
       {
        Lee(Gres.espacio);
       }
       if ($('.board').text() ==  UsuarioActual && pvez == true)
       {
         pvez = false;
         $('.board').text("");
         $('.board').css('background-color','white');
       }
     
          if ($('.board').text() == " ") {$('.board').text("")}  
      $('.board').text($('.board').text() + pulsada);    
       }   
  
    });  
    function Ayuda()
    {
      LeeCGB(Gres.Ingreso);
    }

function Regresar(){
  window.open("../index.html","_self");
}

    function isLetter(str) {
      return str.length === 1 && str.match(/[a-z]/i);
    }
 

    window.addEventListener('touchstart', function(evt){
      evt.preventDefault();
     
        Lee(evt.touches.item(0).target.getAttribute('data'));
     
    });
    window.addEventListener('touchmove', function(evt){
      tocados = 1;
    });

    window.addEventListener('touchend', function(evt){

      if (tocados > 0)
      {
        tocados = 0;

      if (evt.target.className === 'Lt'){ 
 
      if (evt.target.getAttribute('data') == "INGRESAR")
      {
        Navega();
        window.navigator.vibrate(200); 
        return;
      }
      else if ($('.board').text() ==  UsuarioActual && pvez == true)
       {
         pvez =false;
         $('.board').text("");
         $('.board').css('background-color','white');
         return;
       }  
        
       else if (evt.target.getAttribute('data') == 'DEL') {
              board_text = $('.board').text();
              board_text = board_text.substring(0, board_text.length-1);
              $('.board').text(board_text);
              window.navigator.vibrate(200); 
            }
        else { 
                        
          //console.log("touchend" + $(this).attr('data')) ;
          if ($('.board').text() == " ") {$('.board').text("")}   
              $('.board').text($('.board').text() + evt.target.getAttribute('data'));  
              window.navigator.vibrate(200);   
                          
          }
       } 


      }//fin de tocados == 1
      // tocados = 0;
    
     
    

    }, false);
