{
event.preventDefault();

      movil = 0;

	  LeeCGB(document.title + ". " + Gres.MenuActividad + ". ");        
  }

if (event.keyCode == 37) {atras()}
if (event.keyCode == 38) {atras()}
if (event.keyCode == 39) {adelante()}

	Abre(nlec);
}

var nlec = 0;

		var xPosVie = 0;
		var yPosVie;
		var xPosNew;
		var yPosNew;
		var DifX = 0;
		var DifY = 0;

		$(document).on("touchstart mousedown", function (e) {

			xPosVie = 0;
			yPosVie = 0;
			var touchstart = e.type === 'touchstart',

				e = touchstart ? e.originalEvent : e,
				pageX = touchstart ? e.targetTouches[0].pageX : e.pageX,
				pageY = touchstart ? e.targetTouches[0].pageY : e.pageY;

			xPosVie = pageX;
			yPosVie = pageY;
			//////console.log(xPosVie);
		});

		$(document).on("mousemove touchmove", function (e) {
			xPosNew = 0;
			yPosNew = 0;
			var touchstart = e.type === 'touchmove',
				e = touchstart ? e.originalEvent : e,
				pageX = touchstart ? e.targetTouches[0].pageX : e.pageX,
				pageY = touchstart ? e.targetTouches[0].pageY : e.pageY;
			xPosNew = pageX;
			yPosNew = pageY;
		});

		$(document).on("touchend mouseup", function (e) {

			if (e.target.className == "itemL") {
				nlec = e.target.id;
				ingresa();
				return;
			}
			if (e.target.className === 'f1') { return }
			if (e.target.className === 'esc') { return }

			DifX = xPosNew - xPosVie;

			////console.log(xPosNew);
			//arrastró a la derecha
			if (DifX > 200) {
				////console.log( DifX + " derecha " + nlec );
				adelante();

				atras();
			}

			}
