<script>
var enter = 0;
///Numero pulsado
function Npulsado(event)
{
event.preventDefault();
var number = String.fromCharCode(event.which);
var keyCode = event.keyCode || event.which;
//Ayuda
if (keyCode == 112) {            
      $(".AyudaV").css("display","none");
      AyudaM();   
  }

if (event.keyCode == 27)
{
	Regresar();
	return;
}
if (event.keyCode == 37) {atras()}
if (event.keyCode == 38) {atras()}
if (event.keyCode == 39) {adelante()}
if (event.keyCode == 40) {adelante()}


if (event.keyCode == 13)
{
  if (nlec == 1)
  {  
    LeeCGBD(Gres.Peq6)
  }
  if (nlec == 2)
  {LeeCGB(Gres.TecladoQ)}
  if (nlec == 3)
  { window.open("../F1/AyudaBraille.html","_self");}
  if (nlec == 4)
  {
   //Motor
   if (enter == 0){
    enter = 1;
    MotorC();
   }else{
     //function  MotorConfig  en Habla js
     MotoresConfig();
   }
  }

  if (nlec == 5)
  {
    //Velocidad
   if (enter == 0){
    enter = 1;
    VelocidadC();
   }else{

    //function  Velocidad en Habla js
   Velocidad();
   }
    //console.log("valor de Enter " +  enter);
  
  }
  if (nlec == 6)
  {
   //Tono
   if (enter == 0){
    enter = 1;
    TonoC();
   }else{
    //function  Tono  en Habla js
   TonoConfig();
   }    
  }

  if (nlec == 7)
  {
   //Volumen
   if (enter == 0){
    enter = 1;
    VolumenC();
   }else{
    //function  Volumnen  en Habla js
    VolumenV();
   }
    
  }
  if (nlec == 8)
  {www()}
  if (nlec == 9)
  {Mail()}
  if (nlec == 10)
  {wa()}
  if (nlec == 11)
  {MailConsulta()}
 

}

  }
///Fin tecla pulsada
function atras(){
  enter = 0;
  $("#imgTactil").css("display","none");
  $("#imgAyudaPZ").css("display","none");
  $("#imgAyudaCN").css("display","none");
  $("#imgAyudaFJ").css("display","none");  
  $(".AyudaV").css("display","none"); 
	
	nlec--;
	if (nlec < 1){
	 nlec = 11
    }
    $(".itemS").css({"background-color": "white"});
    $(".itemS").css({"color": "black"});
    $("#s"+nlec).css({"background-color": "black"});
    $("#s"+nlec).css({"color": "white"});
    Lee($("#P" + nlec).text());
	
}

function adelante(){

  enter = 0;
  $("#imgTactil").css("display","none");
  $("#imgAyudaPZ").css("display","none");
  $("#imgAyudaCN").css("display","none");
  $("#imgAyudaFJ").css("display","none");  
  $(".AyudaV").css("display","none"); 
	
	nlec++;
	if (nlec > 11){
	 nlec = 1
    }
    $(".itemS").css({"background-color": "white"});
    $(".itemS").css({"color": "black"});
    $("#s"+nlec).css({"background-color": "black"});
    $("#s"+nlec).css({"color": "white"});
    Lee($("#P" + nlec).text());
   
	
}

function AyudaM()
      {
        LeeCGB(document.title);

function Regresar()
      {
        window.open("./index.html","_self");
      }
  

function VelocidadC(){  
LeeCGB("Pulsar alternadamente la tecla enter para configurar la velocidad de voz. También se puede configurar desde cualquier pantalla de Pequén 8 2025 pulsando la tecla F2.")
}
function TonoC(){
LeeCGB("Pulsar alternadamente la tecla enter para configurar el tono de voz. También se puede configurar desde cualquier pantalla de Pequén 8 2025 pulsando la tecla F4.")
}
function VolumenC(){
LeeCGB(" Pulsar alternadamente la tecla enter para configurar el volumen de voz. También se puede configurar desde cualquier pantalla de Pequén 8 2025 pulsando la tecla F8. El valor 1 es el máximo y el valor 0 es el mínimo que equivale a silencio")
}


function MotorC(){
  LeeCGB("Pulsar alternadamente la tecla enter para configurar el motor de voz. También se puede configurar desde cualquier pantalla de Pequén 8 2025 pulsando la tecla F3.")  
}
