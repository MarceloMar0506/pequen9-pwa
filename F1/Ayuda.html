<script>
var enter = 0;
///Numero pulsado
function Npulsado(event)
{
event.preventDefault();
var number = String.fromCharCode(event.which);
var keyCode = event.keyCode || event.which;
//Ayuda
if (keyCode == 112) {            
      $(".AyudaV").css("display","none");
      AyudaM();   
  }

if (event.keyCode == 27)
{
	Regresar();
	return;
}
if (event.keyCode == 37) {atras()}
if (event.keyCode == 38) {atras()}
if (event.keyCode == 39) {adelante()}
if (event.keyCode == 40) {adelante()}


if (event.keyCode == 13)
{
  if (p == 1)
  {  
    LeeCGB(Gres.Peq6)
  }
  if (p == 2)
  {LeeCGB(Gres.TecladoQ)}
  if (p == 3)
  { window.open("../F1/AyudaBraille.html","_self");}
  if (p == 4)
  {
   //Motor
   if (enter == 0){
    enter = 1;
    MotorC();
   }else{
     //function  MotorConfig  en Habla js
     MotoresConfig();
   }
  }

  if (p == 5)
  {
    //Velocidad
   if (enter == 0){
    enter = 1;
    VelocidadC();
   }else{

    //function  Velocidad en Habla js
   Velocidad();
   }
    //console.log("valor de Enter " +  enter);
  
  }
  if (p == 6)
  {
   //Tono
   if (enter == 0){
    enter = 1;
    TonoC();
   }else{
    //function  Tono  en Habla js
   TonoConfig();
   }    
  }

  if (p == 7)
  {
   //Volumen
   if (enter == 0){
    enter = 1;
    VolumenC();
   }else{
    //function  Volumnen  en Habla js
    VolumenV();
   }
    
  }
  if (p == 8)
  {www()}
  if (p == 9)
  {Mail()}
  if (p == 10)
  {wa()}
  if (p == 11)
  {MailConsulta()}
 

}

  }
///Fin tecla pulsada

function Abre(n)
          { 
            if (n ==1){
              LeeCGB(Gres.Peq6)
            }
            else if (n==2){
              LeeCGB(Gres.TecladoQ)
             }
            else if (n==3){
              window.open("../F1/AyudaBraille.html","_self");
             }    
             else if (n==4){
             //Motor
            if (enter == 0){
              enter = 1;
              MotorC();
            }else{
              //function  MotorConfig  en Habla js
              MotoresConfig();
            }
             }   
             else if (n==5){
               //Velocidad
            if (enter == 0){
              enter = 1;
              VelocidadC();
            }else{

              //function  Velocidad en Habla js
            Velocidad();
            }  
           } 
           else if (n==6){
            //Tono
            if (enter == 0){
              enter = 1;
              TonoC();
            }else{
              //function  Tono  en Habla js
            TonoConfig();
            }    

           }
           else if (n==7){
              //Volumen
            if (enter == 0){
              enter = 1;
              VolumenC();
            }else{
              //function  Volumnen  en Habla js
              VolumenV();
            }
           
           }
           if (n == 8)
            {www()}
           if (n == 9)
             {Mail()}
            if (n == 10)
            {wa()}
            if (n == 11)
            {MailConsulta()}
           else if (n==12){
             Regresar();
           }
          }




function atras(){
  enter = 0;
  $("#imgTactil").css("display","none");
  $("#imgAyudaPZ").css("display","none");
  $("#imgAyudaCN").css("display","none");
  $("#imgAyudaFJ").css("display","none");  
  $(".AyudaV").css("display","none"); 
	
	p--;
	if (p < 1){
	 p = 12
    }
    $(".itemS").css({"background-color": "white"});
    $(".itemS").css({"color": "black"});
    $("#s"+p).css({"background-color": "black"});
    $("#s"+p).css({"color": "white"});
    Lee($("#P" + p).text());
	
}

function adelante(){

  enter = 0;
  $("#imgTactil").css("display","none");
  $("#imgAyudaPZ").css("display","none");
  $("#imgAyudaCN").css("display","none");
  $("#imgAyudaFJ").css("display","none");  
  $(".AyudaV").css("display","none"); 
	
	p++;
	if (p > 12){
	 p = 1
    }
    $(".itemS").css({"background-color": "white"});
    $(".itemS").css({"color": "black"});
    $("#s"+p).css({"background-color": "black"});
    $("#s"+p).css({"color": "white"});
    Lee($("#s" + p).text());
   
	
}

      {

      {
        window.open("../index.html","_self");

function www()
{

}

LeeCGB("Pulsar alternadamente la tecla enter para configurar la velocidad de voz. También se puede configurar desde cualquier pantalla de Pequén 8 2025 pulsando la tecla F2.")
}

}

}


function MotorC(){
  LeeCGB("Pulsar alternadamente la tecla enter para configurar el motor de voz. También se puede configurar desde cualquier pantalla de Pequén 8 2025 pulsando la tecla F3.")  
}
