const registerServiceWorker = async () => {
  if ("serviceWorker" in navigator) {
    try {
      const registration = await navigator.serviceWorker.register("./sw.js");

      // Si ya había una versión nueva esperando de una visita anterior,
      // esperamos a que la página termine de cargar antes de activarla
      if (registration.waiting) {
        window.addEventListener("load", () => {
          activarNuevaVersion(registration.waiting);
        });
      }

      // Detección de actualización mientras el usuario ya está navegando
      registration.addEventListener("updatefound", () => {
        const nuevoWorker = registration.installing;
        nuevoWorker.addEventListener("statechange", () => {
          if (nuevoWorker.state === "installed" && navigator.serviceWorker.controller) {
            activarNuevaVersion(nuevoWorker);
          }
        });
      });

    } catch (error) {
      console.error(`Registration failed with ${error}`);
    }
  }
};

function activarNuevaVersion(worker) {
  worker.postMessage({ type: "SKIP_WAITING" });
}

// Freno anti-loop: solo recargamos una vez, y solo si la página ya cargó
let recargando = false;
navigator.serviceWorker.addEventListener("controllerchange", () => {
  if (recargando) return;
  if (!document.hasFocus && document.readyState !== "complete") return; // evita recargar en medio de la carga
  const yaRecargue = sessionStorage.getItem("swRecargado");
  if (yaRecargue) return; // ya recargamos en esta sesión, no lo repetimos
  recargando = true;
  sessionStorage.setItem("swRecargado", "1");
  window.location.reload();
});

registerServiceWorker();

function activarNuevaVersion(worker) {
  worker.postMessage({ type: "SKIP_WAITING" });
}

let deferredPrompt = null;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

window.addEventListener("appinstalled", () => {
  cerrarInstallOverlay();
  deferredPrompt = null;
});

document.addEventListener('keydown', (e) => {
  if (instalarOverlayVisible() && e.keyCode === 13) {
    e.preventDefault(); // evita que el navegador dispare su propio click nativo al soltar Enter
  }
});


  window.addEventListener('load', () => {
  if (instalarOverlayVisible()) {
    mostrarInstallOverlay();
  }
});

    function mostrarBotonInstalar() {
      const esInstalada = window.matchMedia("(display-mode: standalone)").matches;
      if (esInstalada) return;
      const section = document.getElementById("install-section");
      if (!section) return;
      section.style.display = "block";
      document.getElementById("btn-instalar").onclick = () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(() => { deferredPrompt = null; section.style.display = "none"; });
        } else {
          alert("Para instalar: hacé click en el ícono ⊕ en la barra de direcciones del navegador.");
        }
      };
    }

    function mostrarBotonInstalarFallback() {
      const esInstalada = window.matchMedia("(display-mode: standalone)").matches;
      if (esInstalada) return;
      const section = document.getElementById("install-section");
      if (!section) return;
      section.style.display = "block";
      document.getElementById("btn-instalar").onclick = () => {
        alert("Para instalar: hacé click en el ícono ⊕ en la barra de direcciones del navegador.");
      };
    }
  </script>

function hablarYluego(texto, callback) {
  const utterance = new SpeechSynthesisUtterance(texto);
  utterance.lang = "es-ES";
  utterance.onend = callback;
  utterance.onerror = callback; // por si falla la síntesis, igual continuamos
  window.speechSynthesis.speak(utterance);
}

let overlayIndex = 0;

function instalarOverlayVisible() {
  const overlay = document.getElementById('install-overlay');
  return overlay && window.getComputedStyle(overlay).display !== 'none';
}

function botonesOverlay() {
  return Array.from(document.querySelectorAll('#install-banner button'));
}

let avisoInstalarListo = false;

function enfocarBotonOverlay() {
  const botones = botonesOverlay();
  if (!botones.length) return;
  const boton = botones[overlayIndex];
  boton.focus();

  const esInstalar = boton.id === 'btnInstalarAhora'; // ajustá al id real

  if (esInstalar) {
    avisoInstalarListo = false;
    Lee(
      boton.innerText.trim() +
      ". Al confirmar, se abrirá un cuadro de diálogo del sistema que ya no lee Pequén 9. " +
      "Si usa lector de pantalla, actívelo antes de confirmar.",
      () => { avisoInstalarListo = true; }
    );
  } else {
    avisoInstalarListo = true; // otros botones no tienen esta restricción
    Lee(boton.innerText.trim());
  }
}

function activarOverlaySeleccion() {
 
  const botones = botonesOverlay();
  const boton = botones[overlayIndex];
  if (!boton) return;
  
   // console.log( 'btnInstalarAhora' &&  && !avisoInstalarListo);

  // if (boton.id === 'btnInstalarAhora' && !avisoInstalarListo) return;

 

  if (boton.id === 'btnInstalarAhora') {
    Lee("Instalar")
    instalarApp(true); // true = vino por teclado (Enter)
  } else if (boton.id === 'btnContinuarSinInstalar') {
    cerrarInstallOverlay();
  }
}


function navegarOverlay(direccion) {
  const botones = botonesOverlay();
  if (!botones.length) return;
  overlayIndex = (overlayIndex + direccion + botones.length) % botones.length;
  enfocarBotonOverlay();
}
