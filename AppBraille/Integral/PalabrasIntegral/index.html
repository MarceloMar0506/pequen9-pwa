  <script>

  $(document).ready(function() {
      DeterminaMotor(document.title + ". " + Gres.MenuPractica);
    
    $(".F1Ayuda").on('touchend', function(e) {
        e.preventDefault();
        Ayuda();
    });

    $("#virtual-keyboard a").on('mouseup', function(e) {
        e.preventDefault();
        if ($(this).attr('data') == "ENTER")
      {
        Navega();
      }  
        
       else if ($(this).attr('data') == 'ELIMINAR') {
              board_text = $('.board').text();
              board_text = board_text.substring(0, board_text.length-1);
              $('.board').text(board_text);
            }
        else {                         
              $('.board').text($('.board').text() + $(this).attr('data'));              
          }
      });
  });

 

  $(document).keyup(function(e) {
    
    
    if (e.keyCode == 27)
    {
      Regresar();
    }

    if (e.keyCode == 13)
      {
        Navega();
      } 
      




    var ev = $('.board');

    if (ev.is(':visible') == false ) {return}      
 
      pulsada = e.key;
      //console.log(pulsada + "  " + isLetter(pulsada));
      //si no es una letra retorna
      if (isLetter(pulsada) == false && pulsada != "ENTER" ){return}


      if (e.keyCode !=32)
       {
      pulsada = e.key.toUpperCase()
       }

      if (pulsada == "ENTER")
      {
        Navega();
       
      }
      else if (pulsada == "BACKSPACE")
      {
          board_text = $('.board').text();
          Lee(Gres.borro  + board_text.substring(board_text.length-1, board_text.length));
          board_text = board_text.substring(0, board_text.length-1);
          $('.board').text(board_text);  
      } 
      else if (pulsada == "F7")
      {
        return;
      }
      else if (pulsada.includes("ARROW") )
      {
        Lee($('.board').text());
      }
      else 
      {
       if (e.keyCode !=32)
       {
        Lee(Gres.pulsada.toLowerCase());
       }
       if (e.keyCode ==32)
       {
        Lee(Gres.espacio);
       }
       if ($('.board').text() ==  UsuarioActual)
       {
         //UsuarioActual = "";
         $('.board').text("");
         $('.board').css('background-color','white');
       }
       
      $('.board').text($('.board').text() + pulsada);    
       }   
  
    });  
    function Ayuda()
    {
      LeeCGB(Gres.F1Inicio);
    }

function Regresar(){
  window.open("../index.html","_self");
}

    function isLetter(str) {
      return str.length === 1 && str.match(/[a-z]/i);
    }
 

    window.addEventListener('touchstart', function(evt){
      evt.preventDefault();
     
        Lee(evt.touches.item(0).target.getAttribute('data'));
     
    });
    window.addEventListener('touchmove', function(evt){
      tocados = 1;
    });

    window.addEventListener('touchend', function(evt){

      if (tocados > 0)
      {
        tocados = 0;

      if (evt.target.className === 'Lt'){ 
 
      if (evt.target.getAttribute('data') == "ENTER")
      {
        Navega();
        window.navigator.vibrate(200); 
      }  
        
       else if (evt.target.getAttribute('data') == 'DEL') {
              board_text = $('.board').text();
              board_text = board_text.substring(0, board_text.length-1);
              $('.board').text(board_text);
              window.navigator.vibrate(200); 
            }
        else { 
                                   
              $('.board').text($('.board').text() + evt.target.getAttribute('data'));  
              window.navigator.vibrate(200);   
                          
          }
       } 


      }//fin de tocados == 1
      // tocados = 0;
    
     
    

    }, false);


    


  </script>
