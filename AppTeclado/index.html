var s, p=0;


function test(s) {
  
  d=document.getElementById('s'+ s);
  if(d === null || typeof d === 'undefined'){
      return;}
  //d.focus();
  //console.log(s);
  var dice = d.innerText;
  Lee(dice);
  $(".itemS").css({"background-color": "white"});
  $(".itemS").css({"color": "black"});
  $(d).css({"background-color": "black"});
  $(d).css({"color": "white"});
  p=s;
  }

function adelante(){
   p++;
   if (p == 6) {p=1 }
   test(p)
}

function prev() {
p--;
if (p == 0) {p=5} 
test(p)
}
document.onkeyup=function(e) {
event.preventDefault();


e = e || window.event;
if (e.keyCode == 112){
    Ayuda();
    return;   
  }
if (e.keyCode == 37) {prev()}
if (e.keyCode == 38) {prev()}
if (e.keyCode == 39) {adelante()}
if (e.keyCode == 40) {adelante()}
if (e.keyCode == 27) {Cerrar()}
if (e.keyCode == 13) {
   //console.log(p);
   Abre(p)
}

return;
}
test(p);

{

{
  LeeCGB(document.title + ". "  + Gres.MenuActividad);  
}

var items = document.querySelectorAll('.circulo a.itemM');
  
  for(var i = 0, l = items.length; i < l; i++) {
    items[i].style.left = (40 - 35*Math.cos(-0.5 * Math.PI - 2*(1/l)*i*Math.PI)).toFixed(4) + "%";
    
    items[i].style.top = (40 + 35*Math.sin(-0.5 * Math.PI - 2*(1/l)*i*Math.PI)).toFixed(4) + "%";
  }
