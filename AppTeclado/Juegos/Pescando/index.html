$(document).keydown(function(event) {

  if (espera == true ){return}

  //console.log("tope anzuelo " + $("#anzuelo").position().top.toFixed(0));


  if(event.keyCode == 39){
    if (primeraVuelta == 0){
      inicia();
      primeraVuelta =1;
    }
    if (diceDonde.includes() == "pescaste"){return};
    if ($("#barco").position().left > document.documentElement.clientWidth - $("#barco").width()  ){return}

    }

      inicia();

    }

      $("#linea").css({"height":"-=10px"});

  if(event.keyCode == 40){
