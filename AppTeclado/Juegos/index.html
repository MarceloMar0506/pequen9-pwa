  d=document.getElementById('s'+ s);
  if(d === null || typeof d === 'undefined'){
      return;}
  //d.focus();
  //console.log(s);
  var dice = d.innerText;
  Lee(dice);

  $(".itemS").css({"color": "black"});
  $(d).css({"background-color": "black"});
  $(d).css({"color": "white"});
  p=s;
  }

function adelante(){
   p++;
   if (p == 8) {p=1 }
   test(p)
}

function prev() {
p--;
if (p == 0) {p=7} 
test(p)
}
document.onkeyup=function(e) {
event.preventDefault();


e = e || window.event;
if (e.keyCode == 112){
    Ayuda();
    return;   
  }
if (e.keyCode == 37) {prev()}
if (e.keyCode == 38) {prev()}
if (e.keyCode == 39) {adelante()}
if (e.keyCode == 40) {adelante()}
if (e.keyCode == 27) {Cerrar()}
if (e.keyCode == 13) {
   //console.log(p);
   Abre(p)
}

return;
}
test(p);
